name: FlipCardAlbum
options:
  bundleIdPrefix: com.lpkiki
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: F56Q47DAMX
    CODE_SIGN_STYLE: Automatic
    'CODE_SIGN_IDENTITY[sdk=iphonesimulator*]': '-'
    'CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]': YES
    TARGETED_DEVICE_FAMILY: '1,2'
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: 12
    INFOPLIST_KEY_CFBundleDisplayName: 翻页卡册
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
targets:
  FlipCardAlbum:
    type: application
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    platform: iOS
    sources: [App, Shared, ReferenceAssets]
    info:
      path: App/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLSchemes: [flipcardalbum]
    dependencies:
      - target: AlbumWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lpkiki.FlipCardAlbum
        CODE_SIGN_ENTITLEMENTS: Shared/Album.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  AlbumWidget:
    type: app-extension
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    platform: iOS
    sources: [Widget, Shared, ReferenceAssets]
    info:
      path: Widget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lpkiki.FlipCardAlbum.widget
        CODE_SIGN_ENTITLEMENTS: Shared/Album.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  AlbumTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies: [{target: FlipCardAlbum}]
  AlbumUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies: [{target: FlipCardAlbum}]
schemes:
  FlipCardAlbum:
    build:
      targets:
        FlipCardAlbum: all
    test:
      targets: [AlbumTests, AlbumUITests]
